<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Me Kerko</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#0d3b45;--sea:#13a3a8;--foam:#eaf7f6;--line:#c9e3e2;--mut:#58797d;--warn:#b3402a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--foam);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.hide{display:none!important}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--sea);color:#fff}
button.alt{background:var(--foam);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.6}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:#fff}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.msg{font-size:14px;color:var(--mut);margin:8px 0 0;min-height:1.2em} .msg.err{color:var(--warn)}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;position:fixed;inset:0;
  background:linear-gradient(rgba(6,50,70,.45),rgba(6,50,70,.7)),url("water.jpg") center/cover no-repeat,linear-gradient(160deg,#0d3b45,#13a3a8)}
.login{width:100%;max-width:380px;background:rgba(255,255,255,.96);border-radius:16px;padding:24px}
.login h1{margin:0 0 4px;font-size:30px} .login h1 b{color:var(--sea)}
.login p{margin:0 0 12px;color:var(--mut)}
.login button{width:100%;margin-top:14px}
#app{position:fixed;inset:0;--sh:42dvh}
#map{position:absolute;inset:0}
.leaflet-top.leaflet-right{margin-top:112px}
.top{position:absolute;z-index:1000;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px))}
.search{background:#fff;border-radius:26px;height:46px;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.search input{border:0;padding:0;height:100%;border-radius:0;background:transparent;flex:1;min-width:0}
.search input:focus{outline:none}
.search button{background:var(--foam);color:var(--ink);padding:6px 12px;border-radius:18px}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;color:var(--ink);border-radius:18px;padding:6px 12px;font-size:13px;font-weight:500;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.chip.on{background:var(--sea);color:#fff}
.fabs{position:absolute;z-index:1000;right:10px;bottom:calc(var(--sh) + 12px);display:flex;flex-direction:column;gap:8px;align-items:flex-end;transition:bottom .25s}
.fab{width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.fab.on{background:#1a73e8;color:#fff}
.fab.main{width:54px;height:54px;font-size:30px;background:var(--sea);color:#fff;line-height:1}
.sheet{position:absolute;z-index:1000;left:0;right:0;bottom:0;height:var(--sh);background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.3);display:flex;flex-direction:column;transition:height .25s}
.handle{padding:8px 0 4px;cursor:pointer} .handle i{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheethead{padding:0 14px 6px;font-size:15px}
#scroll{overflow-y:auto;flex:1;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px))}
.item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item img,.ph{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;background:#cfe8e8}
.item .b{flex:1;min-width:0} .item b{display:block}
.meta{font-size:13px;color:var(--mut)}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:8px;padding:1px 8px;background:var(--foam);color:var(--ink);margin:2px 4px 2px 0}
.badge.red{background:#fcebeb;color:#a32d2d}
a{color:#0a7d82;font-weight:600}
.acts{margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.del{background:transparent;color:var(--warn);padding:0;font-weight:600}
.foot{font-size:11px;color:var(--mut);margin-top:10px}
#pickbar{position:absolute;z-index:1100;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#pickbar button{background:#7fe3e0;color:var(--ink)}
#modal{position:fixed;inset:0;z-index:2000;background:rgba(6,30,40,.6);display:flex;align-items:flex-end;justify-content:center}
.mc{width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.mc h2{margin:0 0 4px;font-size:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.leaflet-popup-content{margin:10px 12px}
.pop img{width:100%;max-width:220px;border-radius:8px;margin:6px 0;display:block}
</style>
</head>
<body>

<div id="gate">
  <div class="login">
    <h1>Me <b>Kerko</b></h1>
    <p>Hyr për të parë hartën e bizneseve.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="email">
    <label for="pw">Fjalëkalimi</label><input id="pw" type="password" autocomplete="current-password">
    <button id="login" type="button">Hyr</button>
    <p class="msg" id="amsg"></p>
  </div>
</div>

<div id="app" class="hide">
  <div id="map" role="application" aria-label="Harta e bizneseve"></div>
  <div class="top">
    <div class="search">
      <span aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="Kërko emër, kategori ose nr. kontrate">
      <button id="out" type="button">Dil</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="fabs">
    <button id="layers" class="fab" type="button" aria-label="Satelit ose hartë normale">🗺️</button>
    <button id="gps" class="fab" type="button" aria-label="Vendndodhja ime">📍</button>
    <button id="addBtn" class="fab main" type="button" aria-label="Shto biznes">+</button>
  </div>
  <div class="sheet" id="sheet">
    <div class="handle" id="handle" aria-label="Zgjat ose mbyll listën"><i></i></div>
    <div class="sheethead"><b id="title">0 biznese</b></div>
    <div id="scroll">
      <div id="list"></div>
      <div id="more"></div>
      <div class="foot">Harta: Esri, OpenStreetMap</div>
    </div>
  </div>
  <div id="pickbar" class="hide"><span>Prek hartën për të zgjedhur pikën</span><button id="pickdone" type="button">U bë</button></div>
</div>

<div id="modal" class="hide">
  <div class="mc">
    <h2>Shto biznes</h2>
    <label for="n">Emri i biznesit</label><input id="n" maxlength="80">
    <div class="row">
      <div><label for="c">Kategoria</label><select id="c"><option>Dyqan</option><option>Lokal</option><option>Institucion</option><option>Guest house</option><option>Hotel</option></select></div>
      <div><label for="d">Debitor</label><select id="d"><option value="jo">Jo</option><option value="po">Po</option></select></div>
    </div>
    <div class="row">
      <div><label for="k">Nr. i kontratës</label><input id="k" maxlength="40"></div>
      <div><label for="p">Telefoni</label><input id="p" type="tel" maxlength="30"></div>
    </div>
    <label for="t">Shënim</label><input id="t" maxlength="120">
    <label for="f">Foto e biznesit (opsionale)</label><input id="f" type="file" accept="image/*">
    <p class="meta" id="coords" style="margin:10px 0 0">Pika nuk është zgjedhur.</p>
    <div class="bar"><button id="loc" type="button" class="alt">📍 Vendndodhja ime</button><button id="pickmap" type="button" class="alt">Zgjidh në hartë</button></div>
    <div class="bar"><button id="add" type="button">Ruaj biznesin</button><button id="cancel" type="button" class="alt">Anulo</button></div>
    <p class="msg" id="msg"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== SHKRUAJ KËTU KODET E SUPABASE ======
const SUPABASE_URL = "https://eltzkgjaqmjwkuglvrqr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsdHprZ2phcW1qd2t1Z2x2cnFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTAwMDEsImV4cCI6MjEwODI2NjAwMX0.6zN6Q3KWwkLUf6Nos_nXUezEFseX9JMCkxuoKAhc72I";
// ===========================================

const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const CATS = ["Dyqan", "Lokal", "Institucion", "Guest house", "Hotel"];
const STATES = ["56px", "42dvh", "80dvh"];
let me = null, picked = null, pickMarker = null, pickMode = false;
let rows = [], allRows = [], filter = "all", limit = 5, stateIdx = 1;
let watchId = null, meMarker = null, firstFix = true, sat = true, timer = null;

const map = L.map("map", {zoomControl: false, attributionControl: false}).setView([41.15, 20.05], 7);
L.control.zoom({position: "topright"}).addTo(map);
const satellite = L.layerGroup([
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom: 19}),
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {maxZoom: 19})
]);
const normal = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19});
satellite.addTo(map);
const layer = L.layerGroup().addTo(map);

function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
function say(id, t, err){const e=$(id);e.textContent=t||"";e.className="msg"+(err?" err":"");}
function dirUrl(b){return "https://www.google.com/maps/dir/?api=1&destination=" + b.lat + "," + b.lng;}
function badges(b){
  return '<span class="badge">' + esc(b.category) + "</span>" +
    (b.contract_no ? '<span class="badge">Kontratë: ' + esc(b.contract_no) + "</span>" : "") +
    (b.debtor ? '<span class="badge red">Debitor</span>' : "");
}
function setSheet(i){stateIdx = i; $("app").style.setProperty("--sh", STATES[i]); setTimeout(() => map.invalidateSize(), 300);}

function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error("Foto nuk u përpunua.")), "image/jpeg", 0.8);
    };
    img.onerror = () => rej(new Error("Foto nuk u hap."));
    img.src = u;
  });
}

function setPick(lat, lng){
  picked = {lat, lng};
  if (pickMarker) pickMarker.setLatLng([lat, lng]);
  else pickMarker = L.circleMarker([lat, lng], {radius: 10, color: "#ffffff", weight: 3, fillColor: "#e67e22", fillOpacity: 1}).addTo(map);
  $("coords").textContent = "Pika e zgjedhur: " + lat.toFixed(5) + ", " + lng.toFixed(5);
}
function closePick(){pickMode = false; $("pickbar").classList.add("hide"); $("modal").classList.remove("hide");}
map.on("click", e => { if (me && pickMode) setPick(e.latlng.lat, e.latlng.lng); });

function popupHtml(b){
  return '<div class="pop"><b>' + esc(b.name) + "</b><br>" + badges(b) +
    (b.phone ? '<div class="meta">' + esc(b.phone) + "</div>" : "") +
    (b.note ? "<div>" + esc(b.note) + "</div>" : "") +
    (b.photoUrl ? '<img alt="Foto e biznesit" src="' + esc(b.photoUrl) + '">' : "") +
    '<a target="_blank" rel="noopener" href="' + dirUrl(b) + '">Më ço atje</a></div>';
}

function render(){
  layer.clearLayers();
  rows.forEach(b => {
    L.circleMarker([b.lat, b.lng], {radius: 9, color: "#ffffff", weight: 3, fillColor: b.debtor ? "#e24b4a" : "#13a3a8", fillOpacity: 1})
      .addTo(layer).bindPopup(popupHtml(b), {maxWidth: 250});
  });
  const shown = rows.slice(0, limit);
  $("title").textContent = rows.length + " biznese" + (rows.length > limit ? " · po shfaqen " + limit : "");
  $("list").innerHTML = shown.length ? shown.map(b =>
    '<div class="item">' +
    (b.photoUrl ? '<img alt="" src="' + esc(b.photoUrl) + '">' : '<div class="ph"></div>') +
    '<div class="b"><b>' + esc(b.name) + "</b>" + badges(b) +
    '<div class="meta">' + (b.phone ? esc(b.phone) + " · " : "") + "nga " + esc(b.owner_name || "përdorues") + "</div>" +
    '<div class="acts"><a href="#" data-go="' + b.id + '">Shfaq</a>' +
    '<a target="_blank" rel="noopener" href="' + dirUrl(b) + '">Më ço atje</a>' +
    (me && b.owner === me.id ? '<button class="del" data-del="' + b.id + '" type="button">Fshij</button>' : "") +
    "</div></div></div>"
  ).join("") : '<p class="meta">Asnjë biznes nuk u gjet.</p>';
  $("more").innerHTML = rows.length > limit
    ? '<button class="alt" id="moreBtn" type="button" style="width:100%;margin-top:8px">Shfaq edhe 5</button><p class="meta">Për të gjetur të tjerët, kërko me emër ose nr. kontrate.</p>'
    : "";
}

function filterRows(fit){
  const t = $("q").value.trim().toLowerCase();
  rows = allRows.filter(b => {
    if (filter === "debt" && !b.debtor) return false;
    if (filter !== "all" && filter !== "debt" && b.category !== filter) return false;
    if (!t) return true;
    return [b.name, b.category, b.note, b.owner_name, b.contract_no, b.phone].join(" ").toLowerCase().includes(t);
  });
  render();
  if (fit && rows.length) map.fitBounds(L.latLngBounds(rows.map(b => [b.lat, b.lng])), {maxZoom: 17, padding: [60, 60]});
}
function newFilter(fit){limit = 5; filterRows(fit);}
$("q").addEventListener("input", () => { limit = 5; filterRows(false); clearTimeout(timer); timer = setTimeout(() => { if ($("q").value.trim()) filterRows(true); }, 500); });

function drawChips(){
  const list = [["all", "Të gjitha"]].concat(CATS.map(c => [c, c]), [["debt", "Debitorë"]]);
  $("chips").innerHTML = list.map(x => '<button type="button" class="chip' + (filter === x[0] ? " on" : "") + '" data-chip="' + esc(x[0]) + '">' + esc(x[1]) + "</button>").join("");
}
drawChips();

async function load(){
  const {data, error} = await sb.from("businesses").select("*").order("created_at", {ascending: false});
  if (error) { $("list").innerHTML = '<p class="msg err">S’u lexuan të dhënat. Kontrollo kodet e Supabase.</p>'; return; }
  const paths = data.filter(b => b.photo_path).map(b => b.photo_path);
  if (paths.length) {
    const {data: urls} = await sb.storage.from("photos").createSignedUrls(paths, 3600);
    const m = {};
    (urls || []).forEach(u => { if (u.signedUrl) m[u.path] = u.signedUrl; });
    data.forEach(b => { if (b.photo_path) b.photoUrl = m[b.photo_path]; });
  }
  allRows = data; filterRows(false);
}

document.addEventListener("click", async e => {
  const t = e.target;
  if (!t.getAttribute) return;
  const chip = t.getAttribute("data-chip"), go = t.getAttribute("data-go"), del = t.getAttribute("data-del");
  if (chip !== null) { filter = chip; drawChips(); newFilter(false); }
  if (t.id === "moreBtn") { limit += 5; render(); }
  if (go) {
    e.preventDefault();
    const b = allRows.find(x => String(x.id) === go);
    if (b) { if (stateIdx === 2) setSheet(1); map.setView([b.lat, b.lng], 18); }
  }
  if (del && confirm("Ta fshij këtë biznes?")) {
    const b = allRows.find(x => String(x.id) === del);
    const {error} = await sb.from("businesses").delete().eq("id", del);
    if (error) return alert("S’u fshi.");
    if (b && b.photo_path) await sb.storage.from("photos").remove([b.photo_path]);
    load();
  }
});

$("handle").onclick = () => setSheet((stateIdx + 1) % 3);

$("layers").onclick = () => {
  if (sat) { map.removeLayer(satellite); normal.addTo(map); } else { map.removeLayer(normal); satellite.addTo(map); }
  sat = !sat;
};

function stopGps(){
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (meMarker) { map.removeLayer(meMarker); meMarker = null; }
  $("gps").classList.remove("on");
}
$("gps").onclick = () => {
  if (watchId !== null) return stopGps();
  if (!navigator.geolocation) return alert("Pajisja nuk mbështet vendndodhjen.");
  firstFix = true; $("gps").classList.add("on");
  watchId = navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (!meMarker) meMarker = L.circleMarker(ll, {radius: 9, color: "#ffffff", weight: 3, fillColor: "#1a73e8", fillOpacity: 1}).addTo(map);
    else meMarker.setLatLng(ll);
    if (firstFix) { map.setView(ll, 16); firstFix = false; }
  }, () => { stopGps(); alert("Vendndodhja nuk u lejua. Lejoje te shfletuesi."); },
  {enableHighAccuracy: true, maximumAge: 5000});
};

function applyUser(u){
  me = u;
  $("gate").classList.toggle("hide", !!u);
  $("app").classList.toggle("hide", !u);
  if (u) { setTimeout(() => map.invalidateSize(), 50); load(); }
  else { stopGps(); allRows = []; rows = []; render(); }
}

async function doLogin(){
  say("amsg", "Duke hyrë…");
  const {error} = await sb.auth.signInWithPassword({email: $("em").value.trim(), password: $("pw").value});
  if (error) say("amsg", error.message.toLowerCase().includes("invalid login") ? "Email ose fjalëkalim i gabuar." : "Gabim: " + error.message, true);
  else say("amsg", "");
}
$("login").onclick = doLogin;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("out").onclick = () => { if (confirm("Do dalësh?")) sb.auth.signOut(); };

$("addBtn").onclick = () => { say("msg", ""); $("modal").classList.remove("hide"); };
$("cancel").onclick = () => $("modal").classList.add("hide");
$("pickmap").onclick = () => { pickMode = true; $("modal").classList.add("hide"); $("pickbar").classList.remove("hide"); if (stateIdx === 2) setSheet(1); };
$("pickdone").onclick = closePick;
$("loc").onclick = () => {
  if (!navigator.geolocation) return say("msg", "Pajisja nuk mbështet vendndodhjen.", true);
  say("msg", "Duke marrë vendndodhjen…");
  navigator.geolocation.getCurrentPosition(p => { setPick(p.coords.latitude, p.coords.longitude); map.setView([p.coords.latitude, p.coords.longitude], 17); say("msg", ""); },
    () => say("msg", "Vendndodhja nuk u lejua. Përdor “Zgjidh në hartë”.", true), {enableHighAccuracy: true});
};

$("add").onclick = async () => {
  const name = $("n").value.trim();
  if (!name) return say("msg", "Shkruaj emrin e biznesit.", true);
  if (!picked) return say("msg", "Zgjidh një pikë: vendndodhjen tënde ose në hartë.", true);
  $("add").disabled = true; say("msg", "Duke ruajtur…");
  try {
    let photo_path = null;
    const file = $("f").files[0];
    if (file) {
      const blob = await shrink(file);
      photo_path = me.id + "/" + Date.now() + ".jpg";
      const {error: upErr} = await sb.storage.from("photos").upload(photo_path, blob, {contentType: "image/jpeg"});
      if (upErr) throw new Error("Foto nuk u ngarkua: " + upErr.message);
    }
    const {error} = await sb.from("businesses").insert({
      name, category: $("c").value, contract_no: $("k").value.trim(), debtor: $("d").value === "po",
      phone: $("p").value.trim(), note: $("t").value.trim(),
      lat: picked.lat, lng: picked.lng, owner: me.id, photo_path,
      owner_name: (me.user_metadata && me.user_metadata.username) || me.email
    });
    if (error) throw new Error(error.message);
    ["n", "k", "p", "t", "f"].forEach(i => $(i).value = ""); $("d").value = "jo"; picked = null;
    if (pickMarker) { map.removeLayer(pickMarker); pickMarker = null; }
    $("coords").textContent = "Pika nuk është zgjedhur.";
    $("modal").classList.add("hide");
    load();
  } catch (e) { say("msg", "S’u ruajt: " + e.message, true); }
  $("add").disabled = false;
};

sb.auth.onAuthStateChange((_ev, session) => applyUser(session ? session.user : null));
sb.auth.getSession().then(({data}) => applyUser(data.session ? data.session.user : null));
</script>
</body>
</html>
