<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Me Kerko</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
:root{--ink:#0d3b45;--sea:#13a3a8;--foam:#eaf7f6;--card:#ffffff;--line:#c9e3e2;--mut:#58797d;--warn:#b3402a}
*{box-sizing:border-box}
body{margin:0;background:var(--foam);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.hide{display:none!important}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(rgba(6,50,70,.45),rgba(6,50,70,.7)),url("water.jpg") center/cover no-repeat,linear-gradient(160deg,#0d3b45,#13a3a8)}
.login{width:100%;max-width:380px;background:rgba(255,255,255,.96);border-radius:16px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.login h1{margin:0 0 4px;font-size:30px} .login h1 b{color:var(--sea)}
.login p{margin:0 0 16px;color:var(--mut)}
header{background:var(--ink);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:24px} header h1 b{color:#7fe3e0}
#mapwrap{position:relative;width:100%;overflow:hidden}
#map{height:60vh;min-height:340px;width:100%}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px;margin-top:8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);background:#fff}
input:focus,select:focus,button:focus-visible{outline:3px solid #7fe3e0;outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
button{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;background:var(--sea);color:#fff;cursor:pointer}
button.alt{background:var(--foam);color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.6}
.login button{width:100%;margin-top:14px}
header button{background:#7fe3e0;color:var(--ink);padding:8px 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:14px;color:var(--mut);margin:8px 0 0;min-height:1.2em} .msg.err{color:var(--warn)}
.item{padding:10px 0;border-top:1px solid var(--line)}
.meta{font-size:13px;color:var(--mut)}
a{color:#0a7d82;font-weight:600}
.del{background:transparent;color:var(--warn);padding:2px 8px}
img.thumb{display:block;width:100%;max-width:240px;border-radius:8px;margin:6px 0}

/* ---- Pikat e vogla në hartë ---- */
.dotwrap{background:none;border:0}
.dot{display:block;width:16px;height:16px;margin:3px;border-radius:50%;background:var(--sea);border:3px solid #fff;
  box-shadow:0 1px 5px rgba(0,0,0,.55);transition:transform .15s}
.dotwrap:hover .dot,.dotwrap:focus .dot{transform:scale(1.35)}
.pickdot{display:block;width:16px;height:16px;margin:3px;border-radius:50%;background:#f08a24;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.55)}

/* ---- Grupimi i pikave ---- */
.clwrap{background:none;border:0}
.cl{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;border:3px solid #7fe3e0;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.5)}

/* ---- Pulsimi ---- */
.pulsewrap{background:none;border:0;pointer-events:none}
.pulse{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:50%;border:3px solid #7fe3e0;
  background:rgba(127,227,224,.35);animation:pulse 1.4s ease-out infinite}
.pulse.p2{animation-delay:.7s}
@keyframes pulse{0%{transform:scale(.2);opacity:1}100%{transform:scale(1);opacity:0}}

/* ---- Paneli anash ---- */
#panel{position:absolute;top:0;right:0;bottom:0;width:360px;max-width:100%;background:#fff;z-index:1100;
  overflow:auto;box-shadow:-6px 0 24px rgba(0,0,0,.25);animation:slidein .25s ease}
@keyframes slidein{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.pclose{position:absolute;top:8px;right:8px;z-index:2;width:36px;height:36px;padding:0;border-radius:50%;
  background:rgba(13,59,69,.85);color:#fff;font-size:22px;line-height:1}
.pphoto{display:block;width:100%;height:200px;object-fit:cover;background:var(--foam)}
.pnophoto{height:64px;background:linear-gradient(160deg,#0d3b45,#13a3a8)}
.pcontent{padding:14px 16px 18px}
.pcontent h2{font-size:21px;margin:0 0 6px}
.chip{display:inline-block;background:var(--foam);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;color:var(--ink)}
.prow{margin:12px 0 0}
.prow small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-block;text-decoration:none;border-radius:8px;padding:10px 14px;font-weight:600;background:var(--sea);color:#fff}
.btn.alt{background:var(--foam);color:var(--ink);border:1px solid var(--line)}
@media (max-width:700px){
  #panel{top:auto;left:0;width:100%;max-height:62%;border-radius:16px 16px 0 0;animation:slideup .25s ease}
  .pphoto{height:150px}
}
</style>
</head>
<body>

<div id="gate">
  <div class="login">
    <h1>Me <b>Kerko</b></h1>
    <p>Hyr për të parë hartën e bizneseve.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="email">
    <label for="pw">Fjalëkalimi</label><input id="pw" type="password" autocomplete="current-password">
    <button id="login" type="button">Hyr</button>
    <p class="msg" id="amsg"></p>
  </div>
</div>

<div id="app" class="hide">
  <header>
    <h1>Me <b>Kerko</b></h1>
    <div class="bar"><span id="who"></span><button id="gps" type="button">Ndiz GPS</button><button id="out" type="button">Dil</button></div>
  </header>
  <div id="mapwrap">
    <div id="map" role="application" aria-label="Harta e bizneseve"></div>
    <aside id="panel" class="hide" aria-live="polite">
      <button id="pclose" class="pclose" type="button" aria-label="Mbyll">&times;</button>
      <div id="pbody"></div>
    </aside>
  </div>
  <main>
    <section class="card">
      <h2>Shto biznes</h2>
      <p class="meta">Prek hartën ose përdor vendndodhjen tënde për të zgjedhur pikën.</p>
      <div class="row"><div><label for="n">Emri i biznesit</label><input id="n" maxlength="80"></div>
      <div><label for="c">Kategoria</label><select id="c"><option>Ujë i pijshëm</option><option>Pikë shitjeje</option><option>Depo</option><option>Shërbim</option><option>Lokal</option><option>Institucion</option><option>Bashki</option><option>Tjetër</option></select></div></div>
      <div class="row"><div><label for="p">Telefoni</label><input id="p" type="tel" maxlength="30"></div>
      <div><label for="t">Shënim</label><input id="t" maxlength="120"></div></div>
      <label for="f">Foto e biznesit (opsionale)</label>
      <input id="f" type="file" accept="image/*">
      <p class="meta" id="coords">Pika nuk është zgjedhur.</p>
      <div class="bar"><button id="loc" type="button" class="alt">Vendndodhja ime</button><button id="add" type="button">Ruaj biznesin</button></div>
      <p class="msg" id="msg"></p>
    </section>
    <section class="card">
      <h2>Bizneset (<span id="count">0</span>)</h2>
      <input id="q" type="search" placeholder="Kërko biznes ose kategori…" style="margin-bottom:8px">
      <div id="list"></div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== SHKRUAJ KËTU KODET E SUPABASE ======
const SUPABASE_URL = "https://eltzkgjaqmjwkuglvrqr.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsdHprZ2phcW1qd2t1Z2x2cnFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTAwMDEsImV4cCI6MjEwODI2NjAwMX0.6zN6Q3KWwkLUf6Nos_nXUezEFseX9JMCkxuoKAhc72I";
// ===========================================

const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let me = null, picked = null, pickMarker = null, rows = [], allRows = [];
let watchId = null, meMarker = null, firstFix = true;
let selected = null, pulseMarker = null;

const map = L.map("map").setView([41.15, 20.05], 7);
const satellite = L.layerGroup([
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom: 19, attribution: "Tiles &copy; Esri"}),
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", {maxZoom: 19})
]);
const normal = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "&copy; OpenStreetMap"});
satellite.addTo(map);
L.control.layers({"Satelit": satellite, "Hartë normale": normal}, null, {position: "bottomleft"}).addTo(map);

const dotIcon = L.divIcon({className: "dotwrap", html: '<span class="dot"></span>', iconSize: [22, 22], iconAnchor: [11, 11]});
const pickIcon = L.divIcon({className: "dotwrap", html: '<span class="pickdot"></span>', iconSize: [22, 22], iconAnchor: [11, 11]});
const pulseIcon = L.divIcon({className: "pulsewrap", html: '<span class="pulse"></span><span class="pulse p2"></span>', iconSize: [64, 64], iconAnchor: [32, 32]});

const layer = L.markerClusterGroup({
  showCoverageOnHover: false,
  maxClusterRadius: 40,
  iconCreateFunction: c => L.divIcon({className: "clwrap", html: '<div class="cl">' + c.getChildCount() + "</div>", iconSize: [38, 38]})
}).addTo(map);

const panel = $("panel");
L.DomEvent.disableClickPropagation(panel);
L.DomEvent.disableScrollPropagation(panel);

function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
function say(id, t, err){const e=$(id);e.textContent=t||"";e.className="msg"+(err?" err":"");}
function dirUrl(b){return "https://www.google.com/maps/dir/?api=1&destination=" + b.lat + "," + b.lng;}
function imgTag(b){return b.photoUrl ? '<img class="thumb" alt="Foto e biznesit" src="' + esc(b.photoUrl) + '">' : "";}
function telHref(p){return "tel:" + String(p).replace(/[^\d+]/g, "");}

function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error("Foto nuk u përpunua.")), "image/jpeg", 0.8);
    };
    img.onerror = () => rej(new Error("Foto nuk u hap."));
    img.src = u;
  });
}

function setPick(lat, lng){
  picked = {lat, lng};
  if (pickMarker) pickMarker.setLatLng([lat, lng]); else pickMarker = L.marker([lat, lng], {icon: pickIcon}).addTo(map);
  $("coords").textContent = "Pika e zgjedhur: " + lat.toFixed(5) + ", " + lng.toFixed(5);
}
map.on("click", e => { closePanel(); if (me) setPick(e.latlng.lat, e.latlng.lng); });

/* ---- Paneli anash + pulsimi ---- */
function panelHtml(b){
  return (b.photoUrl ? '<img class="pphoto" alt="Foto e biznesit" src="' + esc(b.photoUrl) + '">' : '<div class="pnophoto"></div>') +
    '<div class="pcontent"><h2>' + esc(b.name) + '</h2><span class="chip">' + esc(b.category) + "</span>" +
    (b.note ? '<div class="prow"><small>Përshkrim</small>' + esc(b.note) + "</div>" : "") +
    (b.phone ? '<div class="prow"><small>Telefoni</small><a href="' + esc(telHref(b.phone)) + '">' + esc(b.phone) + "</a></div>" : "") +
    '<div class="prow"><small>Shtuar nga</small>' + esc(b.owner_name || "përdorues") + "</div>" +
    '<div class="pbtns"><a class="btn" target="_blank" rel="noopener" href="' + dirUrl(b) + '">Më ço atje</a>' +
    (b.phone ? '<a class="btn alt" href="' + esc(telHref(b.phone)) + '">Telefono</a>' : "") + "</div></div>";
}

function focusOn(b){
  const z = Math.max(map.getZoom(), 17);
  const size = map.getSize();
  const desktop = window.innerWidth > 700;
  const shift = desktop ? L.point(Math.min(360, size.x) / 2, 0) : L.point(0, size.y * 0.2);
  const target = map.project([b.lat, b.lng], z).add(shift);
  map.flyTo(map.unproject(target, z), z, {duration: 0.6});
}

function select(b){
  selected = b;
  $("pbody").innerHTML = panelHtml(b);
  panel.scrollTop = 0;
  panel.classList.remove("hide");
  if (pulseMarker) map.removeLayer(pulseMarker);
  pulseMarker = L.marker([b.lat, b.lng], {icon: pulseIcon, interactive: false, keyboard: false, zIndexOffset: -1000}).addTo(map);
  focusOn(b);
}

function closePanel(){
  selected = null;
  panel.classList.add("hide");
  if (pulseMarker) { map.removeLayer(pulseMarker); pulseMarker = null; }
}
$("pclose").onclick = closePanel;
document.addEventListener("keydown", e => { if (e.key === "Escape" && selected) closePanel(); });

function render(){
  $("count").textContent = rows.length;
  layer.clearLayers();
  const ms = rows.map(b => {
    const m = L.marker([b.lat, b.lng], {icon: dotIcon, title: b.name});
    m.on("click", () => select(b));
    return m;
  });
  layer.addLayers(ms);
  $("list").innerHTML = rows.length ? rows.map(b =>
    '<div class="item"><b>' + esc(b.name) + "</b> · " + esc(b.category) +
    '<div class="meta">nga ' + esc(b.owner_name || "përdorues") + (b.phone ? " · " + esc(b.phone) : "") + "</div>" +
    (b.note ? "<div>" + esc(b.note) + "</div>" : "") + imgTag(b) +
    '<a href="#" data-go="' + b.id + '">Shfaq në hartë</a> · ' +
    '<a target="_blank" rel="noopener" href="' + dirUrl(b) + '">Më ço atje</a>' +
    (me && b.owner === me.id ? ' <button class="del" data-del="' + b.id + '" type="button">Fshij</button>' : "") + "</div>"
  ).join("") : '<p class="meta">Asnjë biznes ende.</p>';
}

function filterRows(){
  const t = $("q").value.trim().toLowerCase();
  rows = t ? allRows.filter(b => ((b.name||"")+" "+(b.category||"")+" "+(b.note||"")+" "+(b.owner_name||"")).toLowerCase().includes(t)) : allRows;
  render();
}
$("q").addEventListener("input", filterRows);

async function load(){
  const {data, error} = await sb.from("businesses").select("*").order("created_at", {ascending:false});
  if (error) { $("list").innerHTML = '<p class="msg err">S’u lexuan të dhënat. Kontrollo kodet e Supabase.</p>'; return; }
  const paths = data.filter(b => b.photo_path).map(b => b.photo_path);
  if (paths.length) {
    const {data: urls} = await sb.storage.from("photos").createSignedUrls(paths, 3600);
    const m = {};
    (urls || []).forEach(u => { if (u.signedUrl) m[u.path] = u.signedUrl; });
    data.forEach(b => { if (b.photo_path) b.photoUrl = m[b.photo_path]; });
  }
  allRows = data; filterRows();
}

function stopGps(){
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  if (meMarker) { map.removeLayer(meMarker); meMarker = null; }
  $("gps").textContent = "Ndiz GPS";
}
$("gps").onclick = () => {
  if (watchId !== null) return stopGps();
  if (!navigator.geolocation) return alert("Pajisja nuk mbështet vendndodhjen.");
  firstFix = true;
  $("gps").textContent = "GPS: ndezur";
  watchId = navigator.geolocation.watchPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    if (!meMarker) meMarker = L.circleMarker(ll, {radius: 9, color: "#ffffff", weight: 3, fillColor: "#1a73e8", fillOpacity: 1}).addTo(map);
    else meMarker.setLatLng(ll);
    if (firstFix) { map.setView(ll, 16); firstFix = false; }
  }, () => { stopGps(); alert("Vendndodhja nuk u lejua. Lejoje te shfletuesi."); },
  {enableHighAccuracy: true, maximumAge: 5000});
};

function applyUser(u){
  me = u;
  $("gate").classList.toggle("hide", !!u);
  $("app").classList.toggle("hide", !u);
  if (u) {
    $("who").textContent = "👤 " + ((u.user_metadata && u.user_metadata.username) || u.email);
    setTimeout(() => map.invalidateSize(), 50);
    load();
  } else {
    stopGps(); closePanel(); allRows = []; rows = []; render();
  }
}

async function doLogin(){
  say("amsg", "Duke hyrë…");
  const {error} = await sb.auth.signInWithPassword({email: $("em").value.trim(), password: $("pw").value});
  if (error) say("amsg", error.message.toLowerCase().includes("invalid login") ? "Email ose fjalëkalim i gabuar." : "Gabim: " + error.message, true);
  else say("amsg", "");
}
$("login").onclick = doLogin;
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("out").onclick = () => sb.auth.signOut();

$("loc").onclick = () => {
  if (!navigator.geolocation) return say("msg", "Pajisja nuk mbështet vendndodhjen.", true);
  navigator.geolocation.getCurrentPosition(p => { setPick(p.coords.latitude, p.coords.longitude); map.setView([p.coords.latitude, p.coords.longitude], 17); },
    () => say("msg", "Vendndodhja nuk u lejua. Prek hartën.", true), {enableHighAccuracy: true});
};

$("add").onclick = async () => {
  const name = $("n").value.trim();
  if (!name) return say("msg", "Shkruaj emrin e biznesit.", true);
  if (!picked) return say("msg", "Zgjidh një pikë në hartë.", true);
  $("add").disabled = true; say("msg", "Duke ruajtur…");
  try {
    let photo_path = null;
    const file = $("f").files[0];
    if (file) {
      const blob = await shrink(file);
      photo_path = me.id + "/" + Date.now() + ".jpg";
      const {error: upErr} = await sb.storage.from("photos").upload(photo_path, blob, {contentType: "image/jpeg"});
      if (upErr) throw new Error("Foto nuk u ngarkua: " + upErr.message);
    }
    const {error} = await sb.from("businesses").insert({
      name, category: $("c").value, phone: $("p").value.trim(), note: $("t").value.trim(),
      lat: picked.lat, lng: picked.lng, owner: me.id, photo_path,
      owner_name: (me.user_metadata && me.user_metadata.username) || me.email
    });
    if (error) throw new Error(error.message);
    ["n","p","t","f"].forEach(i => $(i).value = ""); picked = null;
    if (pickMarker) { map.removeLayer(pickMarker); pickMarker = null; }
    $("coords").textContent = "Pika nuk është zgjedhur."; say("msg", "U ruajt.");
    load();
  } catch (e) { say("msg", "S’u ruajt: " + e.message, true); }
  $("add").disabled = false;
};

$("list").onclick = async e => {
  const go = e.target.getAttribute("data-go"), del = e.target.getAttribute("data-del");
  if (go) { e.preventDefault(); const b = allRows.find(x => String(x.id) === go); if (b) { select(b); window.scrollTo({top:0, behavior:"smooth"}); } }
  if (del && confirm("Ta fshij këtë biznes?")) {
    const b = allRows.find(x => String(x.id) === del);
    const {error} = await sb.from("businesses").delete().eq("id", del);
    if (error) return say("msg", "S’u fshi.", true);
    if (b && b.photo_path) await sb.storage.from("photos").remove([b.photo_path]);
    if (selected && selected.id === b.id) closePanel();
    load();
  }
};

sb.auth.onAuthStateChange((_ev, session) => applyUser(session ? session.user : null));
sb.auth.getSession().then(({data}) => applyUser(data.session ? data.session.user : null));
</script>
</body>
</html>
