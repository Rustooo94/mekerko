#view.phone #app{left:50%;top:14px;width:390px;height:844px;transform:translateX(-50%) scale(.9);transform-origin:50% 0;box-shadow:0 0 0 10px #0E1626,0 0 0 11px #2A3A55,0 20px 60px rgba(0,0,0,.5)}
#phoneNote{display:none;position:absolute;left:80px;top:300px;width:420px;color:#C9D6EA;font-size:22px;line-height:1.5}
#phoneNote b{display:block;color:#fff;font-size:34px;margin-bottom:10px}
#view.phone #phoneNote{display:block}
#band{position:absolute;left:0;right:0;bottom:0;height:110px;background:#071528;border-top:1px solid #1E3354;display:flex;align-items:center;gap:22px;padding:0 36px;color:#fff}
#prog{position:absolute;left:0;top:-1px;height:3px;width:0;background:var(--blue);transition:width .4s linear}
#num{flex:none;width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:var(--blue);font-size:24px;font-weight:700}
#txt{flex:1;min-width:0}
#capT{font-size:28px;font-weight:700;line-height:1.15}
#capX{margin-top:6px;font-size:19px;color:#C3D0E3;line-height:1.35}
#brand{flex:none;display:flex;align-items:center;gap:12px;text-align:right}
#brand .lg{width:28px;height:40px;background:var(--logo) center/contain no-repeat}
#brand b{display:block;font-size:20px}
#brand small{display:block;font-size:13px;color:#8FA2BE}
#card{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#0B2A55 0%,#071528 70%);color:#fff;text-align:center;transition:opacity .8s}
#card.off{opacity:0;pointer-events:none}
#card .lg{width:92px;height:128px;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 4px 20px rgba(5,88,252,.6))}
#card h1{margin:22px 0 0;font-size:84px;letter-spacing:-.01em;line-height:1}
#card .s1{margin-top:16px;font-size:30px;color:#C3D0E3}
#card .s2{margin-top:10px;font-size:22px;color:#8FA2BE}
#card ul{list-style:none;margin:36px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,auto);gap:12px 36px;font-size:21px;color:#DCE6F5;text-align:left}
#card li::before{content:"";display:inline-block;width:10px;height:10px;background:var(--blue);margin-right:12px;vertical-align:2px}
#cursor{position:absolute;z-index:30;left:800px;top:400px;width:30px;height:30px;pointer-events:none;transition:left .75s cubic-bezier(.4,.1,.2,1),top .75s cubic-bezier(.4,.1,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))}
#cursor.hide{opacity:0}
#ring{position:absolute;z-index:29;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #FFC93C;opacity:0;pointer-events:none}
#ring.go{animation:ring .55s ease-out}
@keyframes ring{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.4)}}
#ctl{position:fixed;z-index:50;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;background:rgba(7,21,40,.92);border:1px solid #2A3A55;transition:opacity .3s}
#ctl.dim{opacity:0}
#ctl button{font:600 15px var(--font);min-height:42px;padding:0 16px;border:1px solid #2A3A55;background:#0E1E36;color:#fff;cursor:pointer}
#ctl button:hover{background:#16305A}
#ctl button.pri{background:var(--blue);border-color:var(--blue)}
#ctl button.rec{background:#B42318;border-color:#B42318}
body.recording #ctl{display:none}
#msg{position:fixed;z-index:51;left:50%;top:16px;transform:translateX(-50%);padding:10px 16px;background:#071528;border:1px solid #2A3A55;color:#fff;font:500 15px var(--font);display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="view" class="desk">
    <div id="phoneNote"><b>Në terren</b>E njëjta platformë në celular: lista e pikave tërhiqet me gisht, menyja hapet nga butoni lart majtas.</div>
    <iframe id="app" title="PikaBlu demo"></iframe>
  </div>
  <div id="band">
    <div id="prog"></div>
    <div id="num">00</div>
    <div id="txt"><div id="capT">PikaBlu</div><div id="capX">Sistemi i menaxhimit të ujësjellësit</div></div>
    <div id="brand"><div><b>PikaBlu</b><small>Version demonstrues · të dhëna fiktive</small></div><span class="lg"></span></div>
  </div>
  <div id="card">
    <div class="lg"></div>
    <h1 id="cardT">PikaBlu</h1>
    <div class="s1" id="cardS1">Sistemi i menaxhimit të ujësjellësit</div>
    <div class="s2" id="cardS2">Ujësjellës Kanalizime sh.a. · Njësia Përmet</div>
    <ul id="cardL" hidden></ul>
  </div>
  <svg id="cursor" class="hide" viewBox="0 0 24 24"><path d="M4 2l15 10.5-6.6 1.2 3.9 7.4-3 1.6-3.9-7.4L4 20z" fill="#fff" stroke="#0B1B2E" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <div id="ring"></div>
</div>
<div id="ctl">
  <button type="button" class="pri" id="bPlay">Luaj prezantimin</button>
  <button type="button" class="rec" id="bRec">Regjistro videon (me muzikë)</button>
  <button type="button" id="bMus">Muzika: aktive</button>
  <button type="button" id="bFull">Ekran i plotë</button>
</div>
<div id="msg"></div>

<script>
(function(){
  var $ = function(i){ return document.getElementById(i); };
  var stage = $("stage"), view = $("view"), fr = $("app"), cur = $("cursor"), ring = $("ring");
  var S = 1;
  function fit(){ S = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = "translate(-50%,-50%) scale(" + S + ")"; stage.style.transformOrigin = "50% 50%"; stage.style.left = "50%"; stage.style.top = "50%"; stage.style.marginLeft = "0"; }
  fit(); addEventListener("resize", fit);

  /* ---------- Muzika origjinale (Web Audio, pa skedarë të jashtëm) ---------- */
  var AC = null, master = null, recDest = null, musicOn = true, schedT = null;
  function midi(n){ return 440 * Math.pow(2, (n - 69) / 12); }
  function startMusic(){
    if (AC) { if (AC.state === "suspended") AC.resume(); return; }
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0;
    var comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    recDest = AC.createMediaStreamDestination(); comp.connect(recDest);
    var delay = AC.createDelay(); delay.delayTime.value = 0.536; var fb = AC.createGain(); fb.gain.value = 0.32; var wet = AC.createGain(); wet.gain.value = 0.35;
    delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(master);
    var lp = AC.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1500; lp.connect(master);
    var BPM = 84, beat = 60 / BPM, bar = beat * 4;
    var CH = [[57, 60, 64, 67], [53, 57, 60, 64], [48, 52, 55, 60], [55, 59, 62, 67]];
    var t0 = AC.currentTime + 0.1, next = 0;
    function pad(f, t, d){
      [0, 7].forEach(function(det){
        var o = AC.createOscillator(), g = AC.createGain(); o.type = "triangle"; o.frequency.value = f; o.detune.value = det - 3;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.028, t + 1.2); g.gain.setValueAtTime(0.028, t + d - 0.6); g.gain.linearRampToValueAtTime(0, t + d + 0.8);
        o.connect(g); g.connect(lp); o.start(t); o.stop(t + d + 1);
      });
    }
    function pluck(f, t){
      var o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.05, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0008, t + 0.9);
      o.connect(g); g.connect(master); g.connect(delay); o.start(t); o.stop(t + 1);
    }
    function bass(f, t, d){
      var o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.09, t + 0.05); g.gain.setTargetAtTime(0.04, t + 0.2, 0.4); g.gain.linearRampToValueAtTime(0, t + d);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.1);
    }
    var ARP = [0, 1, 2, 3, 2, 1, 2, 3];
    function sched(){
      while (t0 + next * bar < AC.currentTime + 1.5) {
        var t = t0 + next * bar, ch = CH[next % 4];
        ch.forEach(function(n){ pad(midi(n), t, bar); });
        bass(midi(ch[0] - 12), t, bar * 0.95);
        if (next >= 2) ARP.forEach(function(k, i){ pluck(midi(ch[k] + 12), t + i * beat / 2); });
        next++;
      }
    }
    sched(); schedT = setInterval(sched, 250);
    master.gain.linearRampToValueAtTime(musicOn ? 0.9 : 0, AC.currentTime + 3);
  }
  function fadeMusic(to, s){ if (!AC) return; master.gain.cancelScheduledValues(AC.currentTime); master.gain.setValueAtTime(master.gain.value, AC.currentTime); master.gain.linearRampToValueAtTime(to, AC.currentTime + s); }
  $("bMus").onclick = function(){ musicOn = !musicOn; this.textContent = "Muzika: " + (musicOn ? "aktive" : "e fikur"); fadeMusic(musicOn ? 0.9 : 0, 0.6); };

  /* ---------- Mjetet e skenave ---------- */
  var wait = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
  var W = function(){ return fr.contentWindow; }, D = function(){ return fr.contentDocument; };
  function load(url){ return new Promise(function(res){ fr.onload = function(){ setTimeout(res, 300); }; fr.src = url; }); }
  function q(sel){ return typeof sel === "string" ? D().querySelector(sel) : sel; }
  async function until(sel, ms){ var t = Date.now(); while (Date.now() - t < (ms || 6000)) { var e = q(sel); if (e && e.getBoundingClientRect().width) return e; await wait(120); } return q(sel); }
  function pt(el){
    var fr2 = fr.getBoundingClientRect(), st = stage.getBoundingClientRect(), r = el.getBoundingClientRect(), k = fr2.width / fr.offsetWidth;
    return {x: (fr2.left + (r.left + Math.min(r.width / 2, 60)) * k - st.left) / S, y: (fr2.top + (r.top + r.height / 2) * k - st.top) / S};
  }
  async function move(sel, ms){ var el = await until(sel); if (!el) return null; el.scrollIntoView({block: "nearest", behavior: "smooth"}); await wait(250); var p = pt(el); cur.classList.remove("hide"); cur.style.left = p.x + "px"; cur.style.top = p.y + "px"; await wait(ms || 850); return el; }
  async function click(sel, pre){
    var el = await move(sel, pre); if (!el) return null;
    ring.style.left = (parseFloat(cur.style.left) + 4) + "px"; ring.style.top = (parseFloat(cur.style.top) + 4) + "px";
    ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go");
    await wait(180); el.click(); await wait(450); return el;
  }
  async function type(sel, text, speed){
    var el = await click(sel); if (!el) return;
    el.focus(); el.value = "";
    for (var i = 0; i < text.length; i++) { el.value += text[i]; el.dispatchEvent(new (W().Event)("input", {bubbles: true})); await wait(speed || 85); }
  }
  async function scrollIn(sel, block){ var el = await until(sel); if (el) el.scrollIntoView({block: block || "start", behavior: "smooth"}); await wait(900); }
  function cap(n, t, x){ $("num").textContent = String(n).padStart(2, "0"); $("capT").textContent = t; $("capX").textContent = x; }
  function prog(p){ $("prog").style.width = (p * 100) + "%"; }
  function card(on, t, s1, s2, list){
    $("cardT").textContent = t || "PikaBlu"; $("cardS1").textContent = s1 || ""; $("cardS2").textContent = s2 || "";
    var l = $("cardL"); l.hidden = !list; l.innerHTML = (list || []).map(function(x){ return "<li>" + x + "</li>"; }).join("");
    $("card").classList.toggle("off", !on);
  }
  function mode(m){ view.className = m; }
  async function nav(k){ await click('.nav [data-nav="' + k + '"]'); await wait(700); }

  /* ---------- Skenat ---------- */
  var SCENES = [
    async function(){ card(true, "PikaBlu", "Sistemi i menaxhimit të ujësjellësit", "Ujësjellës Kanalizime sh.a. · Njësia Përmet"); cap(0, "Prezantimi i platformës", "Harta e abonentëve, puna në terren, defektet, ankesat dhe raportet në një sistem."); await load("../login.html"); await wait(5200); card(false); await wait(600); },
    async function(){ cap(1, "Faqja e hyrjes", "Zona e shërbimit në hartën satelitore: Përmeti është zona aktive, Qarku Gjirokastër shënohet me blu të çelët."); await wait(2600); await move(".btn-hero", 900); await wait(1500); },
    async function(){ cap(2, "Hyrja e stafit", "Çdo punonjës hyn me llogarinë që krijon administratori. Fjalëkalimin e ndryshon vetë nga menyja."); await click(".btn-hero"); await wait(700); await type("#email", "demo@pikablu.al", 70); await type("#pass", "demo2026", 90); await wait(1600); },
    async function(){ cap(3, "Raportimi nga qytetarët", "Pa llogari: lloji i defektit, vendndodhja me GPS, foto ose video dhe numri i telefonit."); await click("#v-login .back"); await wait(500); await click('.h-sec [data-go="report"]'); await wait(900); await click('input[value="Pusetë pa kapak ose e thyer"]'); await wait(900); await scrollIn("#rpGps", "center"); await wait(1200); await scrollIn("#rpGo", "center"); await move("#rpGo", 900); await wait(1000); },
    async function(){ cap(4, "Përmbledhja e ditës", "Pas hyrjes, administratori sheh debitorët, borxhin total, pikat në hartë dhe ndërhyrjet e sotme të stafit."); mode("desk"); await load("app.html"); await until("#wClose", 8000); await wait(1200); await move(".wgrid", 900); await wait(2600); },
    async function(){ cap(5, "Harta e pikave", "Banesa, institucione, biznese dhe kolektorë në hartë. Filtër sipas kategorisë, debitorëve dhe të prerëve."); await click("#wClose"); await wait(1200); await click('[data-chip="debt"]'); await wait(1800); await click('[data-chip="Biznese"]'); await wait(1500); await click('[data-chip="all"]'); await wait(600); await type("#q", "Hotel", 110); await wait(1800); },
    async function(){ cap(6, "Detajet e pikës", "Kontrata, matësi, vula, statusi i kontratës dhe udhëzimi i rrugës deri te pika."); await click("#list .item"); await wait(1600); await scrollIn("#detail .dbar", "center"); await wait(1400); var q2 = D().getElementById("q"); q2.value = ""; q2.dispatchEvent(new (W().Event)("input", {bubbles: true})); },
    async function(){ cap(7, "Ndërhyrjet dhe pagesat", "Kontroll, paralajmërim, prerje, rilidhje. Pas njoftimit pagesa shënohet Në pritje dhe konfirmohet kur abonenti paguan."); W().openDetail(6); await wait(1500); await scrollIn("#ivBox", "start"); await wait(800); await click('#ivBox [data-pay="pagoi"]'); await wait(1600); await scrollIn("#ivBox .upbox", "start"); var a = D().getElementById("ivAct"); if (a) { await move("#ivAct"); a.value = "Paralajmërim"; a.dispatchEvent(new (W().Event)("change", {bubbles: true})); } await wait(900); await move("#ivPay", 900); await wait(1600); },
    async function(){ cap(8, "Regjistri i abonentëve", "Lista nga Excel sipas fshatit: sa abonentë janë hedhur në hartë dhe sa mungojnë ende."); await nav("abon"); await wait(900); await move("#abSum .tr:nth-child(2)", 900); await wait(1500); await click('[data-abz="2"]'); await wait(2200); },
    async function(){ cap(9, "Plotësimi automatik", "Shkruani emrin ose kontratën kur shtoni një pikë: emri, kontrata dhe zona plotësohen nga regjistri."); await nav("map"); await click("#addBtn"); await wait(700); await type("#n", "agro", 160); await wait(900); var o = await move("#abDD .abo", 900); if (o) { o.dispatchEvent(new (W().MouseEvent)("mousedown", {bubbles: true})); } await wait(2000); await click("#cancel"); await wait(500); },
    async function(){ cap(10, "Debitorët", "Listat nga sistemi i faturimit, sipas qytetit dhe fshatrave, me shumën e borxhit dhe lidhjen me pikën në hartë."); await nav("debts"); await wait(900); await scrollIn("#dbSum", "start"); await wait(900); await click("#dbList .dcard"); await wait(2200); },
    async function(){ cap(11, "Defektet e rrjetit", "Raportet e stafit dhe të qytetarëve për ujin dhe kanalizimet, me status: e re, në punë, e rregulluar."); await nav("defects"); await wait(1000); await scrollIn("#dfList", "start"); await wait(1200); await click('[data-dft="e_re"]'); await wait(2000); },
    async function(){ cap(12, "Ankesat dhe kërkesat", "Formulari zyrtar i shërbimit të klientit, me PDF për printim dhe ngarkim të formularit të firmosur."); await nav("complaints"); await wait(1500); await move("#cmList .cmcard", 900); await wait(2400); },
    async function(){ cap(13, "Raporti i ditës", "Ndërhyrjet, pagesat në pritje dhe defektet e ditës, me shkarkim në PDF ose Excel."); await nav("staff"); await wait(1200); var r = await until("#wRep", 4000); if (r) await click("#wRep"); await wait(1500); await move("#rPdf", 900); await wait(1200); await scrollIn("#rBody .rh:nth-of-type(2)", "start"); await wait(2200); },
    async function(){ cap(14, "Më shumë hapësirë për hartën", "Menyja paloset në ikona dhe lista e pikave fshihet me një klikim. Zgjedhja ruhet."); var rb = D().getElementById("rBack"); if (rb) rb.click(); await nav("map"); await click("#navMini"); await wait(1000); await click("#paneTgl"); await wait(2200); await click("#paneTgl"); await wait(700); await click("#navMini"); await wait(800); },
    async function(){ cap(15, "Në celular dhe tablet", "Puna në terren bëhet nga telefoni: lista e pikave tërhiqet, menyja hapet nga butoni."); mode("phone"); cur.classList.add("hide"); await load("app.html"); var c = await until("#wClose", 8000); await wait(1000); if (c) await click("#wClose"); await wait(800); W().setSheet(2); await wait(1600); W().setSheet(1); await wait(900); await click("#navOpen"); await wait(1800); await click("#navScrim"); await wait(900); W().setSheet(0); await wait(1500); },
    async function(){ cur.classList.add("hide"); cap(16, "PikaBlu", "Ujësjellës Kanalizime sh.a. · Njësia Përmet"); card(true, "PikaBlu", "Sistemi i menaxhimit të ujësjellësit", "Ujësjellës Kanalizime sh.a. · Njësia Përmet",
      ["Harta e abonentëve", "Regjistri sipas fshatit", "Debitorët dhe pagesat", "Ndërhyrjet në terren", "Defektet e rrjetit", "Ankesat e klientëve", "Raporti ditor PDF/Excel", "Rolet dhe vëzhguesi", "Celular dhe tablet"]); await wait(8000); }
  ];

  var playing = false;
  async function play(){
    if (playing) return; playing = true;
    try { localStorage.removeItem("pbNavMini"); localStorage.removeItem("pbPaneOff"); } catch (e) {}
    mode("desk"); card(true); prog(0); $("ctl").classList.add("dim");
    var from = Math.max(0, Math.min(SCENES.length - 1, parseInt((location.search.match(/skena=(\d+)/) || [])[1] || "0", 10)));
    if (from > 4) { card(false); await load("app.html"); var wc = await until("#wClose", 8000); if (wc) wc.click(); await wait(600); }
    else if (from > 0) card(false);
    for (var i = from; i < SCENES.length; i++) { prog(i / (SCENES.length - 1)); try { await SCENES[i](); } catch (e) { console.warn("Skena " + i, e); } }
    prog(1); fadeMusic(0, 3); await wait(3200); playing = false;
  }

  /* ---------- Kontrollet ---------- */
  var hideT = null;
  function ctlShow(){ $("ctl").classList.remove("dim"); clearTimeout(hideT); if (playing) hideT = setTimeout(function(){ $("ctl").classList.add("dim"); }, 2200); }
  addEventListener("mousemove", ctlShow);
  function note(t){ var m = $("msg"); m.textContent = t; m.style.display = t ? "block" : "none"; }
  $("bPlay").onclick = async function(){ startMusic(); if (musicOn) fadeMusic(0.9, 2); ctlShow(); await play(); ctlShow(); };
  $("bFull").onclick = function(){ if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){}); else document.exitFullscreen(); };
  $("bRec").onclick = async function(){
    if (playing) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia || !window.MediaRecorder) return note("Ky shfletues nuk e mbështet regjistrimin. Përdorni Chrome ose Edge.");
    startMusic(); if (musicOn) fadeMusic(0.9, 2);
    var ds;
    try { ds = await navigator.mediaDevices.getDisplayMedia({video: {frameRate: 30, width: {ideal: 1920}, height: {ideal: 1080}}, audio: false, preferCurrentTab: true, selfBrowserSurface: "include"}); }
    catch (e) { return note("Regjistrimi u anulua. Zgjidhni skedën (tab) aktuale kur ju kërkohet."); }
    note("");
    var tracks = ds.getVideoTracks().concat(recDest ? recDest.stream.getAudioTracks() : []);
    var types = ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"], mt = types.find(function(t){ return MediaRecorder.isTypeSupported(t); }) || "";
    var rec = new MediaRecorder(new MediaStream(tracks), mt ? {mimeType: mt, videoBitsPerSecond: 8e6} : undefined), chunks = [];
    rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = function(){
      ds.getTracks().forEach(function(t){ t.stop(); }); document.body.classList.remove("recording");
      var blob = new Blob(chunks, {type: "video/webm"}), a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "PikaBlu-prezantimi.webm"; document.body.appendChild(a); a.click(); a.remove();
      note("Videoja u ruajt: PikaBlu-prezantimi.webm (te Shkarkimet).");
    };
    ds.getVideoTracks()[0].addEventListener("ended", function(){ if (rec.state !== "inactive") rec.stop(); });
    document.body.classList.add("recording");
    try { if (!document.fullscreenElement) await document.documentElement.requestFullscreen(); } catch (e) {}
    await wait(1200); rec.start(1000);
    await play();
    if (rec.state !== "inactive") rec.stop();
    if (document.fullscreenElement) document.exitFullscreen();
  };
  load("../login.html").then(function(){ card(true); });
})();
</script>
</body>
</html>
